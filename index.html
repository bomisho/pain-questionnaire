<style>

}
@media (prefers-color-scheme: dark) {

          --mark: rgba(239, 83, 80, 0.45); --mark-line: #ef5350; --bar: rgba(17,20,23,0.94); --focus: #5ea2e6; --shape-line: #8b95a0; --warn: #f0b060; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Noto Naskh Arabic", "Geeza Pro", Tahoma, sans-serif; }
[dir="rtl"] body { font-size: 18px; }
main { max-width: 640px; margin: 0 auto; padding: 0 16px 120px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 640px; margin: 0 auto; padding: 12px 16px; }
.progress { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
button, .button { font: inherit; border-radius: 10px; padding: 11px 18px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; }
button.primary, .button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }

button:focus-visible, .button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.region:focus { outline: none; }
.region:focus-visible > * { stroke: var(--focus); stroke-width: 1.2; }
.row:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: -3px; border-radius: 6px; }

.question > .qtext { color: var(--muted); margin: 0 0 6px; font-size: 16px; }
.rows { border-top: 1px solid var(--line); }

.row input:checked ~ .tick { visibility: visible; }
.row input:checked ~ .label { font-weight: 600; }

.scale input:checked + span { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.scale input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.scale-ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin-top: 6px; direction: ltr; }

[dir="rtl"] .diagram h3 { direction: rtl; text-align: right; }

.nav .spacer { flex: 1; }

.actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 24px; }
.answers h3 { font-size: 17px; margin: 22px 0 6px; }
.answers ul { margin: 0; padding-inline-start: 20px; }

<div class="top">
  <span class="progress" id="progress" aria-live="polite"></span>

<script>
/* Patient answers <-> link payload. Same format as IntakeCodec in the app (Models/PatientIntake.swift):
   v=<form version>&c=<case code>&f=<bitset over codes>&p=<bitset over regions x sides>[&i=<0-10>]&k=<checksum>
   Bitsets are little-endian within each byte and written as base64url without padding.
   The checksum is FNV-1a (32-bit) of "v|c|f|p|i" in base 36: it detects damaged links, not forgery. */
(function (root) {
  'use strict';
  var B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';

  function toB64url(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i += 3) {
      var n = (bytes[i] << 16) | ((bytes[i + 1] || 0) << 8) | (bytes[i + 2] || 0);
      s += B64[(n >> 18) & 63] + B64[(n >> 12) & 63];
      if (i + 1 < bytes.length) s += B64[(n >> 6) & 63];
      if (i + 2 < bytes.length) s += B64[n & 63];
    }
    return s;
  }

  function fromB64url(s) {
    var values = [];
    for (var i = 0; i < s.length; i++) {
      var v = B64.indexOf(s[i]);
      if (v < 0) return null;
      values.push(v);
    }
    if (values.length % 4 === 1) return null;
    var out = [];
    for (var j = 0; j < values.length; j += 4) {
      var chunk = values.slice(j, j + 4);
      var n = 0;
      for (var k = 0; k < chunk.length; k++) n |= chunk[k] << (18 - 6 * k);
      out.push((n >> 16) & 255);
      if (chunk.length > 2) out.push((n >> 8) & 255);
      if (chunk.length > 3) out.push(n & 255);
    }
    return out;
  }

  function bits(indices, count) {
    var bytes = [];
    for (var b = 0; b < Math.ceil(count / 8); b++) bytes.push(0);
    indices.forEach(function (i) { if (i >= 0 && i < count) bytes[i >> 3] |= 1 << (i & 7); });
    return toB64url(bytes);
  }

  function indices(s, count) {
    var bytes = fromB64url(s);
    if (!bytes || bytes.length !== Math.ceil(count / 8)) return null;
    var out = [];
    for (var i = 0; i < bytes.length * 8; i++) {
      if (bytes[i >> 3] & (1 << (i & 7))) {
        if (i >= count) return null;
        out.push(i);
      }
    }
    return out;
  }

  function checksum(str) {
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);          // payloads are ASCII only
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h.toString(36);
  }

  function sanitizeCaseCode(raw) {
    var s = String(raw || '').toUpperCase().replace(/[^A-Z0-9-]/g, '');
    return s.slice(0, 16);
  }

  // answers: { findings: [id], marks: ["region.R" | "region.L"], intensity: 0-10 | null }
  function encode(form, caseCode, answers) {
    var f = bits(answers.findings.map(function (id) { return form.codes.indexOf(id); }), form.codes.length);
    var p = bits(answers.marks.map(function (key) {
      var dot = key.lastIndexOf('.');
      var r = form.regions.indexOf(key.slice(0, dot));
      var side = key.slice(dot + 1);
      return r < 0 || (side !== 'R' && side !== 'L') ? -1 : r * 2 + (side === 'L' ? 1 : 0);
    }), form.regions.length * 2);
    var i = (answers.intensity === null || answers.intensity === undefined) ? '' : String(Math.max(0, Math.min(10, answers.intensity)));
    var v = String(form.version);
    var k = checksum([v, caseCode, f, p, i].join('|'));
    return 'v=' + v + '&c=' + caseCode + '&f=' + f + '&p=' + p + (i === '' ? '' : '&i=' + i) + '&k=' + k;
  }

  function paramsOf(match) {
    var params = {};
    match.split('&').forEach(function (pair) {
      var eq = pair.indexOf('=');
      if (eq > 0) params[pair.slice(0, eq)] = pair.slice(eq + 1);
    });
    return params;
  }

  function parseParams(text) {
    var m = /v=[0-9]+(?:&[a-z]=[A-Za-z0-9_-]*)+/.exec(text || '');
    return m ? paramsOf(m[0]) : null;
  }

  // Returns { caseCode, findings, marks, intensity } or throws Error with .code.
  // Every candidate in the text is tried, like the app does.
  function decode(form, text) {
    var re = /v=[0-9]+(?:&[a-z]=[A-Za-z0-9_-]*)+/g, m, firstError = null;
    while ((m = re.exec(text || '')) !== null) {
      try { return decodeParams(form, paramsOf(m[0])); } catch (e) { if (!firstError) firstError = e; }
    }
    if (firstError) throw firstError;
    var e = new Error('notAnswers'); e.code = 'notAnswers'; throw e;
  }

  function decodeParams(form, q) {
    function fail(code) { var e = new Error(code); e.code = code; throw e; }
    if (!q || q.v === undefined || q.c === undefined || q.f === undefined || q.p === undefined || q.k === undefined) fail('notAnswers');
    if (parseInt(q.v, 10) !== form.version) fail('unsupportedVersion');
    if (!q.c || q.c.length < 3 || sanitizeCaseCode(q.c) !== q.c) fail('badCaseCode');
    var i = q.i === undefined ? '' : q.i;
    if (checksum([q.v, q.c, q.f, q.p, i].join('|')) !== q.k) fail('corrupted');
    var fb = indices(q.f, form.codes.length), pb = indices(q.p, form.regions.length * 2);
    if (!fb || !pb) fail('corrupted');
    var intensity = null;
    if (i !== '') {
      if (!/^[0-9]{1,2}$/.test(i) || +i > 10) fail('corrupted');
      intensity = +i;
    }
    var findings = fb.map(function (n) { return form.codes[n]; });
    form.sections.forEach(function (s) {
      s.questions.forEach(function (qq) {
        if (qq.type !== 'single') return;
        var hits = (qq.items || []).filter(function (it) { return findings.indexOf(it.finding) >= 0; });
        if (hits.length > 1) fail('corrupted');
      });
    });
    return {
      caseCode: q.c,
      findings: findings,
      marks: pb.map(function (n) { return form.regions[n >> 1] + '.' + (n & 1 ? 'L' : 'R'); }),
      intensity: intensity
    };
  }

  root.IntakeCodec = { encode: encode, decode: decode, checksum: checksum, sanitizeCaseCode: sanitizeCaseCode, parseParams: parseParams };
})(typeof module !== 'undefined' ? module.exports : window);

/* Minimal QR code generator (ISO/IEC 18004): byte mode, error correction level M, versions 1-10,
   automatic mask choice. Written for this page so it needs no third-party code or network. */
(function (root) {
  'use strict';
  // Level M: error-correction codewords per block, and number of blocks, for versions 1-10.
  var ECC_PER_BLOCK = [0, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];
  var NUM_BLOCKS = [0, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
  var FORMAT_BITS_M = 0;

  function rawModules(ver) {
    var r = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      var n = Math.floor(ver / 7) + 2;
      r -= (25 * n - 10) * n - 55;
      if (ver >= 7) r -= 36;
    }
    return r;
  }
  function dataCodewords(ver) { return Math.floor(rawModules(ver) / 8) - ECC_PER_BLOCK[ver] * NUM_BLOCKS[ver]; }

  function gfMul(x, y) {
    var z = 0;
    for (var i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11D);
      z ^= ((y >>> i) & 1) * x;
    }
    return z & 255;
  }
  function rsDivisor(degree) {
    var r = [];
    for (var i = 0; i < degree - 1; i++) r.push(0);
    r.push(1);
    var root = 1;
    for (var k = 0; k < degree; k++) {
      for (var j = 0; j < r.length; j++) {
        r[j] = gfMul(r[j], root);
        if (j + 1 < r.length) r[j] ^= r[j + 1];
      }
      root = gfMul(root, 2);
    }
    return r;
  }
  function rsRemainder(data, divisor) {
    var r = divisor.map(function () { return 0; });
    data.forEach(function (b) {
      var factor = b ^ r.shift();
      r.push(0);
      for (var i = 0; i < divisor.length; i++) r[i] ^= gfMul(divisor[i], factor);
    });
    return r;
  }

  function utf8(text) {
    var out = [];
    var s = unescape(encodeURIComponent(text));
    for (var i = 0; i < s.length; i++) out.push(s.charCodeAt(i));
    return out;
  }

  function encodeData(bytes, ver) {
    var bits = [];
    function put(val, len) { for (var i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); }
    put(4, 4);                                  // byte mode
    put(bytes.length, ver <= 9 ? 8 : 16);
    bytes.forEach(function (b) { put(b, 8); });
    var cap = dataCodewords(ver) * 8;
    put(0, Math.min(4, cap - bits.length));
    put(0, (8 - bits.length % 8) % 8);
    for (var pad = 0xEC; bits.length < cap; pad ^= 0xEC ^ 0x11) put(pad, 8);
    var cw = [];
    for (var i = 0; i < bits.length; i += 8) {
      var v = 0;
      for (var j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
      cw.push(v);
    }
    return cw;
  }

  function addEcc(data, ver) {
    var numBlocks = NUM_BLOCKS[ver], eccLen = ECC_PER_BLOCK[ver];
    var raw = Math.floor(rawModules(ver) / 8);
    var numShort = numBlocks - raw % numBlocks, shortLen = Math.floor(raw / numBlocks);
    var div = rsDivisor(eccLen), blocks = [], k = 0;
    for (var i = 0; i < numBlocks; i++) {
      var dat = data.slice(k, k + shortLen - eccLen + (i < numShort ? 0 : 1));
      k += dat.length;
      var ecc = rsRemainder(dat, div);
      if (i < numShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    var result = [];
    for (var c = 0; c < blocks[0].length; c++) {
      blocks.forEach(function (b, j) {
        if (c !== shortLen - eccLen || j >= numShort) result.push(b[c]);
      });
    }
    return result;
  }

  function alignmentPositions(ver, size) {
    if (ver === 1) return [];
    var n = Math.floor(ver / 7) + 2;
    var step = Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
    var r = [6];
    for (var pos = size - 7; r.length < n; pos -= step) r.splice(1, 0, pos);
    return r;
  }

  function build(ver, codewords, mask) {
    var size = ver * 4 + 17, m = [], fn = [];
    for (var y = 0; y < size; y++) { m.push(new Array(size).fill(false)); fn.push(new Array(size).fill(false)); }
    function set(x, y, dark) { m[y][x] = dark; fn[y][x] = true; }

    for (var i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    [[3, 3], [size - 4, 3], [3, size - 4]].forEach(function (c) {
      for (var dy = -4; dy <= 4; dy++) for (var dx = -4; dx <= 4; dx++) {
        var d = Math.max(Math.abs(dx), Math.abs(dy)), xx = c[0] + dx, yy = c[1] + dy;
        if (xx >= 0 && xx < size && yy >= 0 && yy < size) set(xx, yy, d !== 2 && d !== 4);
      }
    });
    var al = alignmentPositions(ver, size);
    al.forEach(function (ay, a) {
      al.forEach(function (ax, b) {
        if ((a === 0 && b === 0) || (a === 0 && b === al.length - 1) || (a === al.length - 1 && b === 0)) return;
        for (var dy = -2; dy <= 2; dy++) for (var dx = -2; dx <= 2; dx++) set(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      });
    });
    drawFormat(0);
    if (ver >= 7) {
      var rem = ver;
      for (var q = 0; q < 12; q++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      var vbits = ver << 12 | rem;
      for (var t = 0; t < 18; t++) {
        var bit = ((vbits >>> t) & 1) === 1, a2 = size - 11 + t % 3, b2 = Math.floor(t / 3);
        set(a2, b2, bit); set(b2, a2, bit);
      }
    }

    function drawFormat(mk) {
      var data = FORMAT_BITS_M << 3 | mk, rem = data;
      for (var i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      var bits = (data << 10 | rem) ^ 0x5412;
      function g(i) { return ((bits >>> i) & 1) === 1; }
      for (var i2 = 0; i2 <= 5; i2++) set(8, i2, g(i2));
      set(8, 7, g(6)); set(8, 8, g(7)); set(7, 8, g(8));
      for (var i3 = 9; i3 < 15; i3++) set(14 - i3, 8, g(i3));
      for (var i4 = 0; i4 < 8; i4++) set(size - 1 - i4, 8, g(i4));
      for (var i5 = 8; i5 < 15; i5++) set(8, size - 15 + i5, g(i5));
      set(8, size - 8, true);
    }

    // Data in the zigzag order.
    var idx = 0;
    for (var right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (var vert = 0; vert < size; vert++) {
        for (var j = 0; j < 2; j++) {
          var x = right - j, up = ((right + 1) & 2) === 0, yy2 = up ? size - 1 - vert : vert;
          if (!fn[yy2][x] && idx < codewords.length * 8) {
            m[yy2][x] = ((codewords[idx >>> 3] >>> (7 - (idx & 7))) & 1) === 1;
            idx++;
          }
        }
      }
    }
    for (var y3 = 0; y3 < size; y3++) for (var x3 = 0; x3 < size; x3++) {
      if (!fn[y3][x3] && maskBit(mask, x3, y3)) m[y3][x3] = !m[y3][x3];
    }
    drawFormat(mask);
    return m;
  }

  function maskBit(mask, x, y) {
    switch (mask) {
      case 0: return (x + y) % 2 === 0;
      case 1: return y % 2 === 0;
      case 2: return x % 3 === 0;
      case 3: return (x + y) % 3 === 0;
      case 4: return (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0;
      case 5: return x * y % 2 + x * y % 3 === 0;
      case 6: return (x * y % 2 + x * y % 3) % 2 === 0;
      default: return ((x + y) % 2 + x * y % 3) % 2 === 0;
    }
  }

  function penalty(m) {
    var size = m.length, score = 0, dark = 0;
    function lines(get) {
      for (var a = 0; a < size; a++) {
        var run = 1, line = [];
        for (var b = 0; b < size; b++) {
          var v = get(a, b);
          line.push(v ? 1 : 0);
          if (b > 0) {
            if (v === get(a, b - 1)) { run++; if (run === 5) score += 3; else if (run > 5) score += 1; }
            else run = 1;
          }
        }
        var s = line.join('');
        var re = /(?=(10111010000|00001011101))/g, hit;
        while ((hit = re.exec(s)) !== null) { score += 40; re.lastIndex++; }
      }
    }
    lines(function (y, x) { return m[y][x]; });
    lines(function (x, y) { return m[y][x]; });
    for (var y = 0; y < size - 1; y++) for (var x = 0; x < size - 1; x++) {
      var c = m[y][x];
      if (c === m[y][x + 1] && c === m[y + 1][x] && c === m[y + 1][x + 1]) score += 3;
    }
    m.forEach(function (row) { row.forEach(function (v) { if (v) dark++; }); });
    var total = size * size;
    score += (Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1) * 10;
    return score;
  }

  function matrix(text) {
    var bytes = utf8(text), ver = 1;
    while (ver <= 10 && 4 + (ver <= 9 ? 8 : 16) + bytes.length * 8 > dataCodewords(ver) * 8) ver++;
    if (ver > 10) throw new Error('Text too long for a QR code');
    var cw = addEcc(encodeData(bytes, ver), ver), best = null, bestScore = Infinity;
    for (var mk = 0; mk < 8; mk++) {
      var mm = build(ver, cw, mk), sc = penalty(mm);
      if (sc < bestScore) { best = mm; bestScore = sc; }
    }
    return best;

    var h = location.hash.replace(/^#/, ''), q = {};
    h.split('&').forEach(function (p) {
      var i = p.indexOf('=');
      if (i > 0) { try { q[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); } catch (e) { /* ignore a malformed part */ } }
    });
    return { q: q, raw: h };
  }
  function answers() {
    var f = Object.keys(S.findings).filter(function (k) { return S.findings[k]; });
    Object.keys(S.single).forEach(function (k) { if (S.single[k]) f.push(S.single[k]); });
    return { findings: codes.filter(function (c) { return f.indexOf(c) >= 0; }),
             marks: Object.keys(S.marks).filter(function (k) { return S.marks[k]; }).sort(), intensity: S.intensity };
  }
  // A reload should not lose the answers, so the draft is kept in this tab's session storage only:
  // never in the address bar (which is saved to browser history and can sync to other devices),
  // and it is cleared by the browser when the tab is closed.
  function draftKey() { return 'ofp-draft:' + S.caseCode; }
  function saveHash() {
    try {
      sessionStorage.setItem(draftKey(), JSON.stringify({ s: S.mode === 'done' ? 'done' : S.step, l: S.lang,
                                                          p: IntakeCodec.encode(FORM, S.caseCode, answers()) }));
    } catch (e) { /* storage unavailable (private mode): answers simply live in memory */ }
  }
  function restoreDraft() {
    try {
      var d = JSON.parse(sessionStorage.getItem(draftKey()) || 'null');
      if (!d) return null;
      apply(IntakeCodec.decode(FORM, d.p));
      return d;
    } catch (e) { return null; /* ignore a damaged draft */ }
  }
  function apply(r) {
    S.findings = {}; S.single = {}; S.marks = {};
    r.findings.forEach(function (id) {
      var q = questionOf(id);
      if (q && q.type === 'single') S.single[q.id] = id; else S.findings[id] = true;
    });
    r.marks.forEach(function (k) { S.marks[k] = true; });
    S.intensity = r.intensity;
  }
  function questionOf(id) {
    for (var i = 0; i < sections.length; i++) for (var j = 0; j < sections[i].questions.length; j++) {
      var q = sections[i].questions[j];
      if ((q.items || []).some(function (it) { return it.finding === id; })) return q;
    }
    return null;
  }

  // ---------- rendering ----------
  function setLang(l) {
    S.lang = l === 'ar' ? 'ar' : 'en';
    document.documentElement.lang = S.lang;
    document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
    document.title = t('form_title');
    document.getElementById('lang').textContent = t('language');
    document.getElementById('lang').setAttribute('lang', S.lang === 'ar' ? 'en' : 'ar');
  }
  function nav(buttons) {
    var n = document.getElementById('nav'), inner = document.getElementById('navInner');
    if (!buttons) { n.hidden = true; inner.innerHTML = ''; return; }
    n.hidden = false;
    inner.innerHTML = buttons;
  }
  function render() {
    var prog = document.getElementById('progress');
    prog.textContent = '';
    if (S.mode === 'missing') { main.innerHTML = '<h1>' + esc(t('form_title')) + '</h1><p class="lead warn">' + esc(t('missing_case')) + '</p>'; nav(null); return; }
    if (S.mode === 'received') return renderReceived();
    if (S.mode === 'done') return renderDone();
    if (S.step === 0) return renderIntro();
    prog.textContent = t('step', S.step, last);
    renderSection(sections[S.step - 1]);
  }
  function renderIntro() {
    main.innerHTML = (ART ? '<img class="hero" alt="" src="' + ART + '">' : '') +
      '<h1>' + esc(t('form_title')) + '</h1>' +
      '<p class="lead">' + esc(t('intro')) + '</p>' +
      '<p class="muted">' + esc(t('privacy')) + '</p>' +
      '<p class="muted">' + esc(t('safety')) + '</p>';
    nav('<span class="spacer"></span><button type="button" class="primary" data-go="1">' + esc(t('start')) + '</button>');
  }
  function renderSection(sec) {
    var h = '<h2 id="sectionTitle" tabindex="-1">' + esc(tx(sec.title)) + '</h2>';
    sec.questions.forEach(function (q) {
      h += '<div class="question" role="group" aria-labelledby="q_' + q.id + '"><p class="qtext" id="q_' + q.id + '">' + esc(tx(q.text)) + '</p>';
      if (q.type === 'multi') {
        h += '<div class="rows">' + q.items.map(function (it) {
          return '<label class="row"><input type="checkbox" data-f="' + it.finding + '"' + (S.findings[it.finding] ? ' checked' : '') + '>' +
            '<span class="label">' + esc(it[S.lang]) + '</span>' + TICK + '</label>';
        }).join('') + '</div>';
      } else if (q.type === 'single') {
        h += '<div class="rows" role="radiogroup">' + q.items.map(function (it) {
          return '<label class="row"><input type="radio" name="' + q.id + '" data-q="' + q.id + '" value="' + it.finding + '"' + (S.single[q.id] === it.finding ? ' checked' : '') + '>' +
            '<span class="label">' + esc(it[S.lang]) + '</span>' + TICK + '</label>';
        }).join('') +
          '<label class="row unsure"><input type="radio" name="' + q.id + '" data-q="' + q.id + '" value=""' + (!S.single[q.id] ? ' checked' : '') + '>' +
          '<span class="label">' + esc(t('not_sure')) + '</span>' + TICK + '</label></div>';
      } else if (q.type === 'scale') {
        h += '<div class="scale" role="radiogroup" aria-labelledby="q_' + q.id + '">';
        for (var n = 0; n <= 10; n++) h += '<label><input type="radio" name="scale" aria-label="' + n + ' / 10" data-scale="' + n + '"' + (S.intensity === n ? ' checked' : '') + '><span>' + n + '</span></label>';
        h += '</div><div class="scale-ends"><span>' + esc(t('scale_none')) + '</span><span>' + esc(t('scale_worst')) + '</span></div>' +
          '<p><button type="button" class="link" data-clear-scale="1">' + esc(t('not_sure')) + '</button></p>';
      } else if (q.type === 'painmap') {
        h += '<p class="note">' + esc(t('face_note')) + '</p>' + PainDiagrams.views.map(diagram).join('') +
          '<div class="marked"><p class="qtext">' + esc(t('marked')) + '</p><p id="markedList">' + esc(markedText()) + '</p></div>';
      }
      h += '</div>';
    });
    main.innerHTML = h;
    var isLast = S.step === last;
    nav('<button type="button" data-go="' + (S.step - 1) + '">' + esc(t('back')) + '</button><span class="spacer"></span>' +
        '<button type="button" class="primary" data-go="' + (isLast ? 'done' : S.step + 1) + '">' + esc(t(isLast ? 'finish' : 'next')) + '</button>');
  }
  function diagram(v) {
    var w = 100, hgt = Math.round(100 * v.aspect);
    var maxw = v.id === 'rear' ? 190 : 380;
    var items = v.items.map(function (it) {
      var key = it.region + '.' + it.side, name = (FORM.region_names[it.region] || {})[S.lang] || it.region;
      var label = name + ', ' + t(it.side === 'R' ? 'right_side' : 'left_side');
      return '<g class="region" role="checkbox" tabindex="0" data-mark="' + key + '" aria-checked="' + (!!S.marks[key]) + '" aria-label="' + esc(label) + '"><title>' + esc(label) + '</title>' + PainDiagrams.shape(it.g) + '</g>';
    }).join('');
    var left = t(v.rightOnViewerLeft ? 'your_right' : 'your_left'), right = t(v.rightOnViewerLeft ? 'your_left' : 'your_right');
    return '<div class="diagram" style="max-width:' + maxw + 'px"><h3>' + esc(t(v.key)) + '</h3>' +
      '<div class="sides" aria-hidden="true"><span>' + esc(left) + '</span><span>' + esc(right) + '</span></div>' +
      '<svg class="map" viewBox="0 0 ' + w + ' ' + hgt + '" role="group" aria-label="' + esc(t(v.key)) + '">' +
      '<g class="outline" aria-hidden="true">' + v.outline + '</g><g class="dashed" aria-hidden="true">' + v.dashed + '</g>' + items + '</svg></div>';
  }
  function markedText() {
    var list = [];
    FORM.regions.forEach(function (r) {
      ['R', 'L'].forEach(function (s) {
        if (S.marks[r + '.' + s]) list.push(((FORM.region_names[r] || {})[S.lang] || r) + ' (' + t(s === 'R' ? 'right_side' : 'left_side') + ')');
      });
    });
    return list.length ? list.join(S.lang === 'ar' ? '، ' : ', ') : t('nothing_marked');
  }
  function returnLinks() {
    var payload = IntakeCodec.encode(FORM, S.caseCode, answers());
    return { web: location.origin + location.pathname + '#' + payload, app: 'orofacialpaindx://intake?' + payload };
  }
  function renderDone() {
    var links = returnLinks();
    main.innerHTML = '<h1 id="sectionTitle" tabindex="-1">' + esc(t('done_title')) + '</h1>' +
      '<p class="lead">' + esc(t('done_send')) + '</p>' +
      '<div class="actions"><button type="button" class="primary" id="share">' + esc(t('share')) + '</button>' +
      '<button type="button" id="copy">' + esc(t('copy')) + '</button></div>' +
      '<p class="muted">' + esc(t('show_code')) + '</p>' +
      '<div class="qr-wrap">' + QR.svg(links.app, esc(t('show_code'))).replace('<svg ', '<svg class="qr" ') + '</div>' +
      '<p style="margin-top:24px"><button type="button" class="link" data-go="' + last + '">' + esc(t('edit')) + '</button></p>' +
      '<p class="note">' + esc(t('safety')) + '</p>';
    nav(null);
    document.getElementById('share').onclick = function () {
      var text = t('share_text') + ' (' + S.caseCode + ')';
      if (navigator.share) { navigator.share({ title: text, text: text, url: links.web }).catch(function () {}); }
      else copy(links.web, this);
    };
    document.getElementById('copy').onclick = function () { copy(links.web, this); };
  }
  function copy(text, btn) {
    var done = function () { btn.textContent = t('copied'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    else { fallbackCopy(text); done(); }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'absolute'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta);
  }
  function renderReceived() {
    var r = S.received;
    if (!r) { main.innerHTML = '<h1>' + esc(t('received_title')) + '</h1><p class="lead warn">' + esc(t('bad_link')) + '</p>'; nav(null); return; }
    var h = '<h1>' + esc(t('received_title')) + '</h1><p class="lead">' + esc(t('received_body', r.caseCode)) + '</p>' +
      '<div class="actions"><a class="button primary" href="orofacialpaindx://intake?' + esc(location.hash.slice(1)) + '">' + esc(t('open_in_app')) + '</a></div><div class="answers">';
    if (r.intensity !== null) h += '<h3>' + esc(tx(sections.filter(function (s) { return s.id === 'intensity'; })[0].title)) + '</h3><p>' + r.intensity + ' / 10</p>';
    sections.forEach(function (sec) {
      var items = [];
      sec.questions.forEach(function (q) { (q.items || []).forEach(function (it) { if (r.findings.indexOf(it.finding) >= 0) items.push(it[S.lang]); }); });
      if (sec.id === 'painmap' && r.marks.length) {
        items = r.marks.map(function (k) { var p = k.split('.'); return ((FORM.region_names[p[0]] || {})[S.lang] || p[0]) + ' (' + t(p[1] === 'R' ? 'right_side' : 'left_side') + ')'; }).concat(items);
      }
      if (items.length) h += '<h3>' + esc(tx(sec.title)) + '</h3><ul>' + items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    });
    main.innerHTML = h + '</div>';
    nav(null);
  }

  // ---------- events ----------
  function go(to) {
    if (to === 'done') { S.mode = 'done'; } else { S.mode = 'form'; S.step = Math.max(0, Math.min(last, +to)); }
    saveHash();
    render();
    window.scrollTo(0, 0);
    var h = document.getElementById('sectionTitle');
    if (h) h.focus({ preventScroll: true });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]');
    if (b) { go(b.getAttribute('data-go')); return; }
    if (e.target.closest('[data-clear-scale]')) { S.intensity = null; Array.prototype.forEach.call(document.querySelectorAll('[data-scale]'), function (i) { i.checked = false; }); saveHash(); return; }
    var g = e.target.closest('.region');
    if (g) toggleMark(g);
  });
  document.addEventListener('keydown', function (e) {
    var g = e.target.closest && e.target.closest('.region');
    if (g && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); toggleMark(g); }
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.hasAttribute('data-f')) S.findings[el.getAttribute('data-f')] = el.checked;
    else if (el.hasAttribute('data-q')) S.single[el.getAttribute('data-q')] = el.value || null;
    else if (el.hasAttribute('data-scale')) S.intensity = +el.getAttribute('data-scale');
    saveHash();
  });
  function toggleMark(g) {
    var k = g.getAttribute('data-mark');
    S.marks[k] = !S.marks[k];
    g.setAttribute('aria-checked', String(!!S.marks[k]));
    var m = document.getElementById('markedList');
    if (m) m.textContent = markedText();
    saveHash();
  }
  document.getElementById('lang').onclick = function () {
    setLang(S.lang === 'ar' ? 'en' : 'ar');
    if (S.mode === 'form' || S.mode === 'done') saveHash();
    render();
  };

  // ---------- start ----------
  var h = readHash();
  setLang(h.q.l || (/^ar\b/i.test(navigator.language || '') ? 'ar' : 'en'));
  if (h.q.k !== undefined && h.q.v !== undefined) {
    // A patient's answers opened by the clinician.
    S.mode = 'received';
    try { S.received = IntakeCodec.decode(FORM, h.raw); } catch (err) { S.received = null; }
  } else {
    S.caseCode = IntakeCodec.sanitizeCaseCode(h.q.c);
    if (!S.caseCode || S.caseCode.length < 3 || S.caseCode !== h.q.c) { S.mode = 'missing'; }
    else {
      var draft = restoreDraft();
      if (draft) {
        if (draft.l) setLang(draft.l);
        if (draft.s === 'done') S.mode = 'done';
        else S.step = Math.max(0, Math.min(last, parseInt(draft.s, 10) || 0));
      } else {
        S.step = Math.max(0, Math.min(last, parseInt(h.q.s || '0', 10) || 0));
      }
    }
  }
  render();
})();
</script>
</body>
</html>
